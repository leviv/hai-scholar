<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HAI Scholar</title>
  <meta name="description" content="A listen-and-read path from zero to PhD-level literacy in Human-AI Interaction, built only from established papers, lectures and essays.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HAI Scholar">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="back" id="back" aria-label="Back" hidden>
      <svg viewBox="0 0 12 20" width="12" height="20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="back-label">Back</span>
    </button>
    <h1 id="title">HAI Scholar</h1>
    <div class="topbar-right" id="topbar-right"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="miniplayer" id="miniplayer" hidden>
    <button class="mini-open" id="mini-open">
      <span class="mini-kicker">Now listening</span>
      <span class="mini-title" id="mini-title"></span>
    </button>
    <button class="mini-btn" id="mini-toggle" aria-label="Play or pause"></button>
  </div>

  <nav class="tabbar" id="tabbar">
    <a href="#/" data-tab="path">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19c3-1 4-4 8-4s5 3 8 4M7 12l2-6 3 4 3-5 2 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Today</span>
    </a>
    <a href="#/library" data-tab="library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3v16H5zM10 4h3v16h-3zM15.5 4.5l2.9-.8 3.6 15.5-2.9.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Library</span>
    </a>
    <a href="#/progress" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Progress</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
